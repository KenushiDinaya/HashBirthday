# Netlify build configuration — deploy by drag & drop of the repo,
# or connect this folder as a Git repository on Netlify.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (safe for client-side navigation)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term caching for heavy static media (images + song)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/song.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
